apiVersion: argoproj.io/v1alpha1
kind: workflowTemplate
metadata:
  generateName: check-run-ci-github-notifier
  annotations:
    workflows.argoproj.io/description: >-
      Report CI state to GitHub as a check run rather than a commit status.

      Check runs are objects with their own IDs, so the pending report and the
      final result are the same check run: the notify-pending task writes the
      new ID to a file, Argo lifts it out as an output parameter, and the
      final task passes it back as check_run_id to update rather than create.

      Check runs can only be written by a GitHub App, so this template
      authenticates with an App private key mounted from a secret. Create it
      with:
      kubectl create secret generic github-app-key --from-file=app.pem=/path/to/app.pem
    workflows.argoproj.io/maintainer: '@tim_sendible'
    workflows.argoproj.io/tags: github
    workflows.argoproj.io/version: '>= 2.9.0'
spec:
  entrypoint: main
  arguments:
    parameters:
      - name: organisation
        value: ""
      - name: app_repo
        value: ""
      - name: git_sha
        value: ""
      - name: app_id
        value: ""
      - name: context
        value: "ci/build"
  templates:
  - name: main
    dag:
      tasks:
        - name: notify-pending
          template: github-notifier
          arguments:
            parameters:
              - name: state
                value: "pending"
              - name: description
                value: "Build running"
              - name: check_run_id
                value: ""

        - name: build
          depends: notify-pending
          template: build

        # The check run created above is updated, not replaced: its ID
        # comes back out of notify-pending as an output parameter.
        - name: notify-result
          depends: build
          template: github-notifier
          arguments:
            parameters:
              - name: state
                value: "success"
              - name: description
                value: "Build passed"
              - name: check_run_id
                value: "{{tasks.notify-pending.outputs.parameters.check_run_id}}"

  - name: build
    container:
      image: alpine:3
      command: [sh, -c]
      args: ["echo building"]

  - name: github-notifier
    inputs:
      parameters:
      - name: state
      - name: description
      - name: check_run_id
    outputs:
      parameters:
      - name: check_run_id
        valueFrom:
          path: /tmp/check_run_id
          default: ""
    volumes:
      - name: github-app-key
        secret:
          secretName: github-app-key
    container:
      image: ghcr.io/crumbhole/ci-github-notifier:stable
      imagePullPolicy: Always
      volumeMounts:
        - name: github-app-key
          mountPath: /secrets
          readOnly: true
      env:
        - name: api
          value: checks
        - name: state
          value: "{{inputs.parameters.state}}"
        - name: target_url
          value: "https://argo-workflows.mydomain/biz/workflows/{{workflow.namespace}}/{{workflow.name}}"
        - name: description
          value: "{{inputs.parameters.description}}"
        - name: context
          value: "{{workflow.parameters.context}}"
        - name: check_run_id
          value: "{{inputs.parameters.check_run_id}}"
        - name: check_run_id_file
          value: /tmp/check_run_id
        - name: app_id
          value: "{{workflow.parameters.app_id}}"
        - name: app_private_key_file
          value: /secrets/app.pem
        - name: organisation
          value: "{{workflow.parameters.organisation}}"
        - name: app_repo
          value: "{{workflow.parameters.app_repo}}"
        - name: git_sha
          value: "{{workflow.parameters.git_sha}}"
      resources:
        requests:
          memory: 8Mi
          cpu: 1m
      #Timeout after 5 minutes
      activeDeadlineSeconds: 300
