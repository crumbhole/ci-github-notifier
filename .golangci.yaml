version: "2"

run:
  timeout: 5m

linters:
  enable:
    # Core
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

    # Security
    - gosec
    - bidichk

    # Error handling
    - errorlint
    - errchkjson
    - nilerr
    - wrapcheck

    # Code quality
    - revive
    - gocritic
    - unconvert
    - unparam
    - prealloc
    - dupl
    - goconst
    - wastedassign

    # Complexity
    - gocyclo
    - gocognit
    - funlen
    - nestif

    # Style
    - misspell
    - whitespace
    - godot
    - nakedret
    - nonamedreturns
    - dogsled
    - grouper
    - tagliatelle

    # Bug prevention
    - bodyclose
    - contextcheck
    - noctx
    - copyloopvar
    - durationcheck
    - sqlclosecheck
    - asasalint
    - containedctx
    - forcetypeassert
    - makezero
    - mirror
    - nosprintfhostport

    # Modernization
    - intrange
    - exptostd

    # Testing
    - thelper
    - tparallel
    - testifylint

    # Logging/Metrics
    - loggercheck
    - promlinter

    # Interfaces
    - ireturn

    # Globals
    - gochecknoglobals

    # Exhaustiveness
    - exhaustive

    # Miscellaneous
    - dupword
    - godox
    - goprintffuncname
    - nolintlint
    - predeclared
    - reassign
    - usestdlibvars

  settings:
    errcheck:
      check-type-assertions: true
      check-blank: true

    govet:
      enable-all: true

    gocyclo:
      min-complexity: 15

    gocognit:
      min-complexity: 20

    funlen:
      lines: 100

    nakedret:
      max-func-lines: 30

    tagliatelle:
      # The GitHub statuses API this tool posts to uses snake_case keys
      # (target_url, …), so any struct tags we add must match.
      case:
        rules:
          json: snake

    goconst:
      min-len: 3
      min-occurrences: 3

    gosec:
      excludes:
        - G104  # Audit errors not checked (covered by errcheck)

    revive:
      rules:
        # Error handling
        - name: error-return
        - name: error-strings
        - name: error-naming

        # Naming
        - name: var-naming
        - name: receiver-naming
        - name: time-naming

        # Imports
        - name: blank-imports
        - name: context-as-argument
        - name: dot-imports

        # Documentation
        - name: package-comments
        - name: exported

        # Complexity
        - name: cyclomatic
          arguments:
            - 15
        - name: cognitive-complexity
          arguments:
            - 20

        # Code structure
        - name: empty-block
        - name: superfluous-else
        - name: unreachable-code
        - name: early-return
        - name: indent-error-flow

        # Style
        - name: unused-parameter
        - name: unused-receiver
        - name: confusing-naming
        - name: bare-return
        - name: identical-branches

        # Bug prevention
        - name: range-val-in-closure
        - name: range-val-address
        - name: waitgroup-by-value
        - name: atomic
        - name: defer
        - name: unconditional-recursion

  exclusions:
    generated: strict
    rules:
      # Test files can have longer functions and similar test patterns
      - path: _test\.go
        linters:
          - goconst
          - unparam
          - errcheck
          - noctx
          - thelper

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/crumbhole/ci-github-notifier

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
